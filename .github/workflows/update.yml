name: Update exit-risk evidence
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Optional historic start YYYY-MM-DD (manual inspection)'
        required: false
        default: ''
      days:
        description: 'Manual span (1-180)'
        required: false
        default: '13'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '12 1 * * *' # Daily 09:12 Singapore
permissions:
  contents: write
concurrency:
  group: exit-risk-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Historical EDINET backfill and annual extraction
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          if [ -z "$EDINET_API_KEY" ]; then
            echo 'Missing EDINET_API_KEY: collection cannot proceed' >&2
            exit 1
          fi
          python -m src.backfill --days 120 --archive-limit 50 --delay 2.5
      - name: Recently submitted documents
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          BACKFILL_START: ${{ inputs.start }}
          BACKFILL_DAYS: ${{ inputs.days }}
        run: |
          if [ -n "$BACKFILL_START" ]; then
            python -m src.edinet --start "$BACKFILL_START" --days "$BACKFILL_DAYS" --download 15
          else
            python -m src.edinet --days 13 --download 15
          fi
      - name: Extract annual financial candidates
        run: python -m src.extract
      - name: Check extraction accuracy and document incomparability
        run: python -m src.quality
      - name: Discover official REINS reports
        id: reins_discovery
        continue-on-error: true
        run: python -m src.reins_sources
      - name: Report REINS TLS or index discovery failure without corrupting other research
        if: steps.reins_discovery.outcome == 'failure'
        run: |
          echo '::warning title=REINS index unavailable::Official REINS HTTPS certificate validation or report discovery failed. No new REINS report links were accepted. EDINET and existing Tokyo/15-company analysis continue.'
          echo '### REINS index discovery FAILED (not verified)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Official REINS HTTPS/index collection failed. Existing market data are retained unchanged. Do NOT interpret this run as a successful REINS update. Check SSL certificate chain before restoring the monitor.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify sourced REINS market observations
        run: python -m src.market
      - name: Build separate preliminary and verified indicators
        run: python -m src.analyze
      - name: Rebuild official-IR comparable peer figures
        run: python -m src.compare_ir
      - name: Enforce full 15-group coverage and report missing annual evidence
        run: python -m src.cohort
      - name: Compare exactly 15 economic groups without mixing resale categories
        run: python -m src.peer_matrix
      - name: Recalculate Tokyo 23 wards versus Tama transaction-mix test
        run: python -m src.tokyo_composition
      - name: Validate five Tokyo ward district market signals
        run: python -m src.tokyo_districts
      - name: Validate company price-band resale and Tokyo market evidence separation
        run: python -m src.segment_evidence
      - name: Generate evidence-gated editorial readiness report
        run: python -m src.editorial
      - name: Commit evidence and progress
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/processed docs/STATUS.md docs/QUALITY.md docs/EDITORIAL.md docs/COHORT_COVERAGE.md
          if git diff --cached --quiet; then
            echo 'No new evidence'
          else
            git commit -m 'data: resume annual filing backfill and capture source-linked candidates'
            git push
          fi
